<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gigaplan</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            #gigaplan-widget {
                height: 100%;
            }
        </style>
        <script src="https://telegram.org"></script>
    </head>
    <body>
        <div id="gigaplan-widget"></div>
        <script>
            (function () {
                var prefix = '';
                if (/\.github\.io$/i.test(location.hostname)) {
                    var segment = location.pathname.split('/').filter(Boolean)[0];
                    if (segment) prefix = '/' + segment;
                }
                if (!prefix) return;

                function rewrite(url) {
                    if (typeof url === 'string' && url.indexOf('/tests/') === 0) {
                        return prefix + url;
                    }
                    return url;
                }

                var xhrOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (method, url) {
                    arguments[1] = rewrite(url);
                    return xhrOpen.apply(this, arguments);
                };

                if (window.fetch) {
                    var origFetch = window.fetch;
                    window.fetch = function (input, init) {
                        if (typeof input === 'string') input = rewrite(input);
                        return origFetch.call(this, input, init);
                    };
                }
            })();
        </script>
        <script src="./gigaplan-widget.js"></script>
        <script>
            (function () {
                if (
                    !window.GigaplanWidget ||
                    typeof window.GigaplanWidget.mountGigaplanWidget !== 'function'
                ) {
                    return;
                }

                var params = new URLSearchParams(window.location.search);
                var complexId = params.get('complexId') || params.get('complex') || undefined;

                window.GigaplanWidget.mountGigaplanWidget({
                    target: '#gigaplan-widget',
                    mode: 'telegram',
                    complexId: complexId,
                    positionButton: 'right',
                });
            })();
        </script>
    </body>
</html>
